
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff7900">
  <title>DrakScripts | Halloween</title>
  <style>
    :root {
      --orange: #ff7900;
      --dark: #100b14;
      --panel: #1b1421;
      --text: #f8f4fc;
      --muted: #aaa0b5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at top, #40200f 0, transparent 48%),
        var(--dark);
      font-family: Arial, sans-serif;
    }

    header {
      padding: 24px 18px;
      text-align: center;
      border-bottom: 1px solid #3d2a22;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      color: var(--orange);
      letter-spacing: 1px;
    }

    header p {
      color: var(--muted);
      margin-bottom: 0;
    }

    main {
      width: min(680px, 92%);
      margin: 32px auto;
    }

    .panel {
      padding: 24px;
      background: rgba(27, 20, 33, .96);
      border: 1px solid #493021;
      border-radius: 18px;
      box-shadow: 0 12px 40px #0005;
    }

    h2 { margin-top: 0; }

    .description {
      color: var(--muted);
      line-height: 1.5;
    }

    .drop-area {
      display: block;
      margin-top: 22px;
      padding: 28px 16px;
      text-align: center;
      border: 2px dashed #805027;
      border-radius: 14px;
      background: #110d17;
      cursor: pointer;
    }

    .drop-area:focus-within {
      outline: 2px solid var(--orange);
    }

    .upload-icon {
      font-size: 38px;
      display: block;
      margin-bottom: 12px;
    }

    input[type="file"] {
      display: block;
      width: 100%;
      margin-top: 16px;
      color: var(--muted);
    }

    button, .link-button {
      display: inline-block;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      color: #160d06;
      background: var(--orange);
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .upload-button {
      width: 100%;
      margin-top: 18px;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: #100d14;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .hidden { display: none; }

    .result {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #493021;
    }

    .result label {
      display: block;
      margin: 14px 0 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .url-row {
      display: flex;
      gap: 8px;
    }

    .url-row input {
      min-width: 0;
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #493021;
      background: #100d14;
      color: white;
    }

    .url-row button {
      padding: 10px;
    }

    .discord {
      display: block;
      margin-top: 22px;
      color: var(--orange);
      text-align: center;
    }

    footer {
      padding: 24px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 430px) {
      .panel { padding: 18px; }
      .url-row { flex-direction: column; }
      .url-row button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">🎃 DRAKSCRIPTS</div>
    <p>Teus arquivos, teus links.</p>
  </header>

  <main>
    <section class="panel">
      <h2>👻 Hospedar arquivo</h2>
      <p class="description">
        Envia arquivos Lua ou TXT e recebe links para visualizar
        ou baixar o arquivo.
      </p>

      <form id="uploadForm">
        <label class="drop-area" for="fileInput">
          <span class="upload-icon">📁</span>
          <strong>Seleciona teu arquivo</strong>
          <p class="description">Formatos aceitos: .lua e .txt</p>
          <input
            id="fileInput"
            name="file"
            type="file"
            accept=".lua,.txt,text/plain"
            required
          >
        </label>

        <button class="upload-button" id="uploadButton" type="submit">
          🚀 Enviar arquivo
        </button>
      </form>

      <div id="status" class="status hidden" role="status"></div>

      <section id="result" class="result hidden">
        <h3>✅ Arquivo hospedado!</h3>

        <label for="rawUrl">Link RAW</label>
        <div class="url-row">
          <input id="rawUrl" readonly>
          <button type="button" data-copy="rawUrl">Copiar</button>
        </div>

        <label for="downloadUrl">Link Download</label>
        <div class="url-row">
          <input id="downloadUrl" readonly>
          <button type="button" data-copy="downloadUrl">Copiar</button>
        </div>
      </section>

      <a class="discord" href="https://discord.gg/SvNyxB4xj"
         target="_blank" rel="noopener noreferrer">
        💬 DrakScripts | Comunidade Discord
      </a>
    </section>
  </main>

  <footer>
    © DrakStudios · DrakScripts 🎃
  </footer>

  <script>
    const form = document.getElementById("uploadForm");
    const fileInput = document.getElementById("fileInput");
    const button = document.getElementById("uploadButton");
    const statusBox = document.getElementById("status");
    const result = document.getElementById("result");

    function showStatus(message) {
      statusBox.textContent = message;
      statusBox.classList.remove("hidden");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const file = fileInput.files[0];

      if (!file) {
        showStatus("Seleciona um arquivo primeiro.");
        return;
      }

      if (!/\.(lua|txt)$/i.test(file.name)) {
        showStatus("Só são aceitos arquivos .lua ou .txt.");
        return;
      }

      if (file.size > 1024 * 1024) {
        showStatus("O arquivo deve ter no máximo 1 MB.");
        return;
      }

      const data = new FormData();
      data.append("file", file);

      button.disabled = true;
      button.textContent = "Enviando...";
      result.classList.add("hidden");
      showStatus("Enviando arquivo para o DrakScripts...");

      try {
        const response = await fetch("/api/upload", {
          method: "POST",
          body: data
        });

        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(payload.error || payload.message ||
            "Falha no upload. Verifica a configuração do servidor.");
        }

        if (!payload.rawUrl || !payload.downloadUrl) {
          throw new Error("O servidor não retornou os links esperados.");
        }

        document.getElementById("rawUrl").value = payload.rawUrl;
        document.getElementById("downloadUrl").value = payload.downloadUrl;
        result.classList.remove("hidden");
        showStatus("Upload concluído com sucesso! 🎉");
      } catch (error) {
        showStatus(error.message || "Erro ao enviar o arquivo.");
      } finally {
        button.disabled = false;
        button.textContent = "🚀 Enviar arquivo";
      }
    });

    document.querySelectorAll("[data-copy]").forEach((copyButton) => {
      copyButton.addEventListener("click", async () => {
        const input = document.getElementById(copyButton.dataset.copy);

        try {
          await navigator.clipboard.writeText(input.value);
          copyButton.textContent = "Copiado!";
          setTimeout(() => copyButton.textContent = "Copiar", 1500);
        } catch {
          input.select();
          showStatus("Seleciona o link e copia manualmente.");
        }
      });
    });
  </script>
</body>
</html>
